<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Shadow Maker — Glassmorphism Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-emoji">🎨</span>
                <div class="title-col">
                    <h1>Neumorphic Shadow Maker</h1>
                    <p class="tagline">Soft-shadow neumorphism generator with bevel sliders.</p>
                </div>
            </div>
            <div class="badge">css</div>
        </header>

        <main class="workspace-card">
            
            <div style="display:flex; justify-content:center; padding:30px 0; background:#12121a; border-radius:12px;">
                <div id="neu-box" style="width:100px; height:100px; background:#12121a; border-radius:20px; box-shadow: 8px 8px 16px #09090d, -8px -8px 16px #1b1b27;"></div>
            </div>
        
        </main>
        
        <footer class="app-footer">
            <p>Created as a premium portfolio piece by <a href="https://github.com/VARSHAN69" target="_blank">@VARSHAN69</a></p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
